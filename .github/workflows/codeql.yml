name: "CodeQL"

# Static analysis (SAST) for the Go source, separate from ci.yml's
# test/coverage gate. Runs on every push/PR to main plus a weekly
# schedule so newly-published CodeQL queries get applied even on
# weeks with no commits.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      # gousb is cgo and needs libusb headers to build, same as ci.yml.
      - name: Install libusb + build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev pkg-config build-essential

      - uses: github/codeql-action/init@v4
        with:
          languages: go

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"
