name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets docker-publish.yml call this as a reusable workflow, so a
  # release re-runs the exact same test/coverage gate rather than
  # duplicating those steps in a second workflow file.
  workflow_call: {}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MIN_COVERAGE: "95"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      # cgo needs these even to `go build`/`go vet`, unlike a pure-Go project.
      # tesseract-ocr/tesseract-ocr-eng/unpaper are needed so
      # internal/ocr's tests can run the real deskew+OCR pipeline rather
      # than mocking the one external-process boundary that's cheap to
      # just run for real (see that package's own test comments).
      - name: Install libusb + build tools + OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev pkg-config build-essential tesseract-ocr tesseract-ocr-eng unpaper

      - run: go vet ./...

      - run: go build ./...

      - name: Test with coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Enforce coverage gate
        run: |
          # internal/scsiusb/usbdevice.go only talks to real USB hardware
          # and can't be meaningfully unit-tested; it's excluded from the
          # coverage total the same way locally (see test.sh / README.md).
          grep -v internal/scsiusb/usbdevice.go coverage.out > coverage.filtered.out
          go tool cover -html=coverage.filtered.out -o coverage.html
          TOTAL=$(go tool cover -func=coverage.filtered.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage (excluding usbdevice.go): ${TOTAL}%"
          awk -v total="$TOTAL" -v min="$MIN_COVERAGE" 'BEGIN { exit (total + 0 >= min + 0) ? 0 : 1 }' || {
            echo "::error::Coverage ${TOTAL}% is below the ${MIN_COVERAGE}% target"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage.html

  docker-build:
    # Separate from `test` so a Dockerfile/base-image problem is never
    # mistaken for a Go one, or vice versa. This exists because neither
    # Dockerfile base-image bump (golang, alpine) that Dependabot opens
    # actually touches Go source — without this, `test` passing gave
    # those PRs a green check despite the Dockerfile itself never having
    # been built.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
